<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huh? Cat Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- トゥーン調の日本語フォントを読み込みます -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Yusei Magic', sans-serif;
            /* 明るい青空のようなグラデーション背景 */
            background: linear-gradient(to top, #87CEEB, #1E90FF);
        }
        /* 動画に白い輪郭線を付けてキャラクター感をアップさせます */
        .cat-outline {
            filter: drop-shadow(0 0 4px white) drop-shadow(0 0 8px white);
        }
        /* テキストに黒い縁取りを付けて読みやすくします */
        .text-stroke {
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                -2px  0   0 #000,
                 2px  0   0 #000,
                 0   -2px 0 #000,
                 0    2px 0 #000;
        }
        
        /* --- レインボーエフェクト用のCSSアニメーション --- */
        /* 虹色の輝きと移動を組み合わせた、より派手なアニメーション */
        @keyframes rainbow-comet-ltr { /* Left to Right */
            0%   { transform: translate(-50%, -50%) scale(1.2) rotate(-15deg); left: -20%; filter: hue-rotate(0deg) drop-shadow(0 0 10px #ff00ff) brightness(1.7); }
            50%  { filter: hue-rotate(180deg) drop-shadow(0 0 20px #ffff00) brightness(1.2); }
            100% { transform: translate(-50%, -50%) scale(1.2) rotate(15deg); left: 120%; filter: hue-rotate(360deg) drop-shadow(0 0 10px #ff00ff) brightness(1.7); }
        }
        @keyframes rainbow-comet-rtl { /* Right to Left */
            0%   { transform: translate(-50%, -50%) scale(1.2) rotate(15deg); left: 120%; filter: hue-rotate(0deg) drop-shadow(0 0 10px #00ffff) brightness(1.7); }
            50%  { filter: hue-rotate(180deg) drop-shadow(0 0 20px #00ff00) brightness(1.2); }
            100% { transform: translate(-50%, -50%) scale(1.2) rotate(-15deg); left: -20%; filter: hue-rotate(360deg) drop-shadow(0 0 10px #00ffff) brightness(1.7); }
        }

        .rainbow-comet-ltr {
            animation: rainbow-comet-ltr 2.5s linear forwards;
        }
        .rainbow-comet-rtl {
            animation: rainbow-comet-rtl 2.5s linear forwards;
        }

    </style>
    <meta name="description" content="クリックするたびに「Huh?」と反応するネコのWebクリッカーゲーム。スコアはローカル保存。">
    <link rel="canonical" href="https://huh-cat.morilab-garage.com/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://huh-cat.morilab-garage.com/">
    <meta property="og:title" content="Huh? Cat Clicker">
    <meta property="og:description" content="クリックするたびに「Huh?」と反応するネコのWebクリッカーゲーム。スコアはローカル保存。">
    <meta property="og:image" content="https://morilab-garage.com/screenshots/huh-cat-clicker.jpg">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Huh? Cat Clicker",
      "url": "https://huh-cat.morilab-garage.com/",
      "description": "クリックするたびに「Huh?」と反応するネコのWebクリッカーゲーム。スコアはローカル保存。",
      "image": "https://morilab-garage.com/screenshots/huh-cat-clicker.jpg",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "inLanguage": "ja",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "JPY"
      },
      "author": {
        "@type": "Person",
        "@id": "https://morilab-garage.com/#person",
        "name": "MasakiMori",
        "url": "https://morilab-garage.com/about/"
      }
    }
    </script>
</head>
<body class="h-screen overflow-hidden relative cursor-pointer">

    <!-- select-noneクラスを追加して、この中のテキストが選択されないようにします -->
    <div class="absolute top-8 left-1/2 -translate-x-1/2 text-center w-full px-4 select-none">
        <!-- text-strokeクラスで見出しに縁取りを追加 -->
        <h1 class="text-4xl md:text-6xl font-bold text-white mb-2 text-stroke">Huh? Cat Clicker</h1>
        
        <!-- カウンターとシェアボタンを横並びにするためのコンテナ -->
        <div class="mt-4 flex justify-center items-center gap-4">
            <!-- カウンター部分 -->
            <div class="bg-black/30 rounded-xl px-4 py-2">
                <p class="text-white text-2xl">
                    <span id="clickCounter" class="font-bold text-yellow-300">0</span> Huh?
                </p>
            </div>
            <!-- Twitterシェアボタン -->
            <a id="twitterShareBtn" href="#" class="bg-[#1DA1F2] hover:bg-[#0c85d0] text-white p-3 rounded-full transition-colors duration-200" title="Share on X">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
            </a>
            <!-- GitHubリンクボタン -->
            <a href="https://github.com/m-masaki72/HuhCatClicker" target="_blank" class="bg-gray-800 hover:bg-gray-600 text-white p-3 rounded-full transition-colors duration-200" title="View on GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.91 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
            </a>
        </div>
    </div>
    
    <!-- アイドル状態（しばらく操作がない時）のメッセージ -->
    <div id="idleMessage" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center select-none pointer-events-none">
        <p class="text-4xl md:text-6xl font-bold text-white text-stroke animate-pulse">Tap to Huh?</p>
    </div>

    <script>
        const counterElement = document.getElementById('clickCounter');
        const bodyElement = document.body;
        const idleMessageElement = document.getElementById('idleMessage');
        const twitterShareBtn = document.getElementById('twitterShareBtn');
        let idleTimer;

        let clickCount = parseInt(localStorage.getItem('huhCatClickCount')) || 0;
        counterElement.textContent = clickCount;

        function startIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                idleMessageElement.classList.remove('hidden');
            }, 3000);
        }

        twitterShareBtn.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();

            const tweetText = `「Huh? Cat Clicker」で ${clickCount} 回 Huh? しました！ #HuhCatClicker`;
            const pageUrl = location.href; 
            const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}&url=${encodeURIComponent(pageUrl)}`;
            
            window.open(shareUrl, '_blank', 'width=600,height=400');
        });

        bodyElement.addEventListener('click', () => {
            idleMessageElement.classList.add('hidden');
            startIdleTimer();

            clickCount++;
            counterElement.textContent = clickCount;
            localStorage.setItem('huhCatClickCount', clickCount);

            const newCat = document.createElement('video');
            newCat.className = 'absolute pointer-events-none w-4/5 sm:w-2/3 md:w-1/2 lg:w-1/3 max-w-[450px]';
            newCat.playsInline = true;
            newCat.setAttribute('playsinline', '');
            newCat.preload = 'auto';
            newCat.muted = false;
            newCat.volume = 0.5;

            // --- レア猫の出現判定 ---
            const rarity = Math.random();
            const isGolden = rarity < 0.05; // 5%の確率で金色の猫
            const isRainbow = rarity >= 0.05 && rarity < 0.10; // 5%の確率で虹色の猫

            const randomScale = Math.random() * 0.8 + 0.6;
            const randomRotation = Math.random() * 60 - 30;

            if (isGolden) {
                newCat.style.filter = 'sepia(100%) saturate(400%) hue-rotate(-50deg) brightness(1.5) drop-shadow(0 0 8px gold) drop-shadow(0 0 16px yellow)';
                newCat.playbackRate = Math.random() < 0.5 ? 2.5 : 1.0;
                newCat.dataset.loopCount = 1;
                newCat.dataset.scale = randomScale;
                newCat.dataset.rotation = randomRotation;
                
                const randomTop = Math.random() * 70 + 15;
                const randomLeft = Math.random() * 70 + 15;
                newCat.style.top = `${randomTop}%`;
                newCat.style.left = `${randomLeft}%`;
                
                newCat.classList.add('transition-transform', 'duration-200');
                newCat.style.transform = `translate(-50%, -50%) scale(${randomScale * 0.95}) rotate(${randomRotation}deg)`;
                setTimeout(() => {
                    newCat.style.transform = `translate(-50%, -50%) scale(${randomScale}) rotate(${randomRotation}deg)`;
                }, 100);

            } else if (isRainbow) {
                // --- 虹色の猫（流れ星）の処理 ---
                newCat.loop = true; // ループ再生を有効にする
                newCat.playbackRate = 3.0; // 超高音の鳴き声
                const randomTop = Math.random() * 80 + 10; // Y位置をランダムに
                newCat.style.top = `${randomTop}%`;

                if (Math.random() < 0.5) {
                    newCat.classList.add('rainbow-comet-ltr'); // 左から右へ
                } else {
                    newCat.classList.add('rainbow-comet-rtl'); // 右から左へ
                }
                // アニメーション終了後に要素を削除
                newCat.addEventListener('animationend', () => {
                    newCat.remove();
                });

            } else {
                // --- 通常の猫の処理 ---
                newCat.classList.add('cat-outline', 'transition-transform', 'duration-200');
                const randomPitch = Math.random() * 1.2 + 1.0;
                newCat.playbackRate = randomPitch;
                
                const randomTop = Math.random() * 70 + 15;
                const randomLeft = Math.random() * 70 + 15;
                newCat.style.top = `${randomTop}%`;
                newCat.style.left = `${randomLeft}%`;

                newCat.style.transform = `translate(-50%, -50%) scale(${randomScale * 0.95}) rotate(${randomRotation}deg)`;
                setTimeout(() => {
                    newCat.style.transform = `translate(-50%, -50%) scale(${randomScale}) rotate(${randomRotation}deg)`;
                }, 100);
            }

            const sourceElement = document.createElement('source');
            sourceElement.src = 'huh.webm';
            sourceElement.type = 'video/webm';
            newCat.appendChild(sourceElement);

            bodyElement.appendChild(newCat);
            
            const playPromise = newCat.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // AbortErrorは再生が意図的に中断された場合のエラーなので、コンソールを汚さないように無視します。
                    if (error.name !== 'AbortError') {
                        console.error("動画の再生に失敗しました:", error);
                        // 実際に問題が起きた場合のみ要素を削除します。
                        if (newCat.parentNode) {
                            newCat.remove();
                        }
                    }
                });
            }
            
            newCat.addEventListener('ended', () => {
                // 金色の猫のループ処理と、通常の猫の削除処理
                if (newCat.dataset.loopCount) {
                    let currentCount = parseInt(newCat.dataset.loopCount, 10);
                    if (currentCount < 5) {
                        let currentScale = parseFloat(newCat.dataset.scale);
                        const rotation = newCat.dataset.rotation;
                        const newScale = currentScale * 1.25;
                        newCat.dataset.scale = newScale;
                        newCat.style.transform = `translate(-50%, -50%) scale(${newScale}) rotate(${rotation}deg)`;
                        
                        newCat.dataset.loopCount = currentCount + 1;
                        newCat.currentTime = 0;
                        newCat.play();
                        return;
                    }
                }
                // 虹色の猫はanimationendで消えるので、ここでは何もしない
                if (!isRainbow) {
                    newCat.remove();
                }
            });
        });
    </script>

</body>
</html>
